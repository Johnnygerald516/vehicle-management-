@if (showSidebar()) {
  <div class="app">
    <header class="page-header">
      <div class="header-brand">
        <img
          class="header-logo-img"
          src="coat-of-arms-of-tanzania.png"
          alt="Tanzania coat of arms"
          width="500"
          height="500"
        />
        <div class="header-titles">
          <span class="header-line">The United Republic of Tanzania</span>
          <span class="header-line header-line--strong">Ministry of Home Affairs</span>
          <span class="header-line header-line--small">Immigration Services Department</span>
        </div>
        <img
          class="header-logo-img"
          src="immigration.png"
          alt="Immigration logo"
          width="316"
          height="296"
        />
      </div>
    </header>
    <div class="app-body">
      <aside class="sidebar">
        <div class="sidebar-user">
          <div class="avatar">A</div>
          <div class="user-info">
            <p class="user-name">Admin User</p>
            <p class="user-role">Administrator</p>
            <p class="user-time">{{ currentTime() }}</p>
          </div>
        </div>
        <nav>
          <a routerLink="/dashboard" (click)="toggleSection('dashboard')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M3 12 L12 3 L21 12" />
              <path d="M5 12 V19 H19 V12" />
              <path d="M10 19 V14 H14 V19" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a routerLink="/drivers" (click)="toggleSection('drivers')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M5 20a7 7 0 0 1 14 0" />
            </svg>
            <span>Driver</span>
          </a>
          <a routerLink="/vehicles" (click)="toggleSection('vehicles')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M6 13 L8 8 H16 L18 13" />
              <path d="M4 13 H20 V17 H18.5 L18 15 H6 L5.5 17 H4 V13" />
              <circle cx="8" cy="16.5" r="1.5" />
              <circle cx="16" cy="16.5" r="1.5" />
            </svg>
            <span>Vehicle</span>
          </a>
          <a routerLink="/assignments" (click)="toggleSection('assignments')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="3" width="16" height="18" rx="2" />
              <path d="M8 1 V6" />
              <path d="M16 1 V6" />
              <path d="M9 12 H15" />
              <path d="M9 16 H15" />
            </svg>
            <span>Assignment</span>
          </a>
          <a routerLink="/fuel" (click)="toggleSection('fuel')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M19 5 L19 12 L14 18 H5 V5 H19" />
              <path d="M19 12 L14 12 L14 18" />
            </svg>
            <span>Fuel Management</span>
          </a>
          <a routerLink="/maintenance" (click)="toggleSection('maintenance')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3" />
              <path d="M12 2 V5" />
              <path d="M12 19 V22" />
              <path d="M2 12 H5" />
              <path d="M19 12 H22" />
              <path d="M4.9 4.9 L7.1 7.1" />
              <path d="M16.9 16.9 L19.1 19.1" />
              <path d="M4.9 19.1 L7.1 16.9" />
              <path d="M16.9 7.1 L19.1 4.9" />
            </svg>
            <span>Maintenance</span>
          </a>
          <a routerLink="/incidents" (click)="toggleSection('incidents')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M10.29 3.86 L1.82 18 A2 2 0 0 0 3.54 21 H20.46 A2 2 0 0 0 22.18 18 L13.71 3.86 A2 2 0 0 0 10.29 3.86 Z" />
              <path d="M12 9 V13" />
              <path d="M12 17 H12.01" />
            </svg>
            <span>Incidents</span>
          </a>
          <a routerLink="/reports" (click)="toggleSection('reports')" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="4" y="4" width="16" height="16" rx="2" />
              <path d="M8 16 V11" />
              <path d="M12 16 V7" />
              <path d="M16 16 V13" />
            </svg>
            <span>Report</span>
          </a>
        </nav>
        <div class="sidebar-footer">
          <button class="btn btn-secondary sign-out" (click)="logout()">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21 H5a2 2 0 0 1-2-2 V5a2 2 0 0 1 2-2 h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Sign out</span>
          </button>
        </div>
      </aside>
      <div class="content">
        <main>
          <router-outlet />
        </main>
      </div>
    </div>
  </div>
} @else {
  <router-outlet />
}
